name: Deploy to www.grepcode.cn

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: https://repos.grepcode.cn/actions/checkout@v4

      - name: Install Hugo
        run: |
          curl -L -s -o /tmp/hugo.tar.gz \
            https://github.com/gohugoio/hugo/releases/download/v0.160.1/hugo_extended_0.160.1_linux-amd64.tar.gz
          tar xzf /tmp/hugo.tar.gz -C /usr/local/bin/
          hugo version

      - name: Build
        run: |
          rm -rf dist
          hugo
          echo "Built: $(find dist -name '*.html' | wc -l) pages"

      - name: Deploy to ra
        env:
          RA_SSH_KEY: ${{ secrets.RA_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$RA_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          rsync -avz --delete dist/ houming818@ra.grepcode.cn:/data/docker/nginx/static/www.grepcode.cn/
          echo "Deploy done"
