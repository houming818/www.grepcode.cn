name: Deploy to www.grepcode.cn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: reg.grepcode.cn/zoo/hugo-cos:latest
    steps:
      - name: Checkout
        run: |
          git clone https://x-access-token:${{ secrets.GITEA_TOKEN }}@repos.grepcode.cn/houming818/grepcode-blog.git .
          echo "Checked out: $(git log -1 --format='%h %s')"

      - name: Build
        run: |
          rm -rf dist
          hugo --buildFuture
          echo "Built: $(find dist -name '*.html' | wc -l) pages"

      - name: SEO audit
        run: |
          sh scripts/seo-audit.sh dist

      - name: Deploy to COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: www-grepcode-cn-1251320938
          COS_REGION: ap-shanghai
        run: |
          coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" -m 30
          find dist -type f -printf '%P\n' | LC_ALL=C sort > /tmp/site-manifest.new
          coscmd download /_deploy/site-manifest.txt /tmp/site-manifest.old || true
          touch /tmp/site-manifest.old
          LC_ALL=C sort -u /tmp/site-manifest.old -o /tmp/site-manifest.old
          comm -23 /tmp/site-manifest.old /tmp/site-manifest.new |
            while IFS= read -r stale; do
              [ -n "$stale" ] && coscmd delete -f -y "/$stale"
            done
          coscmd upload -r -s dist/ /
          coscmd upload -f /tmp/site-manifest.new /_deploy/site-manifest.txt
          echo "Deploy done"
