name: Deploy to www.grepcode.cn

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    container:
      image: reg.grepcode.cn/zoo/hugo-node:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          rm -rf dist
          hugo --buildFuture
          echo "Built: $(find dist -name '*.html' | wc -l) pages"

      - name: Deploy to COS
        env:
          COS_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          COS_BUCKET: www-grepcode-cn-1251320938
          COS_REGION: ap-shanghai
        run: |
          apk add --no-cache python3 py3-pip >/dev/null 2>&1
          python3 -m venv --system-site-packages /tmp/venv
          . /tmp/venv/bin/activate
          pip install coscmd -q --break-system-packages 2>/dev/null || true
          which coscmd && coscmd config -a "$COS_SECRET_ID" -s "$COS_SECRET_KEY" -b "$COS_BUCKET" -r "$COS_REGION" -m 30
          ls dist/ | head -5
          echo "Deploy done (CI build only, cron handles actual upload)"
