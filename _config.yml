# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: stduolc
subtitle: coding and thinking
description:
author: stduolc
language: zh-CN
timezone: Asia/Shanghai

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://www.grepcode.cn
root: /
permalink: :year/:link_title/
permalink_defaults:

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link: true # Open external links in new tab
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

highlight:
  enable: false
  line_number: frontend
  trim_indent: backend
  auto_detect: false
  label:
    left: Code
    right: ':'

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: material
#theme: Paradox
theme.busuanzi.enable: true
disqus_shortname: stduolc

# Toc
toc:
  maxDepth: 4

# Deployment
## Docs: https://hexo.io/docs/deployment.html
deploy:
  - type: git
    repo: git@github.com:stduolc/stduolc.github.io.git
    branch: master

  - type: rsync
    host: qcloud.grepcode.cn
    user: stduolc
    root: /home/workspace/static.grepcode.cn
    port: 9000
    delete: true
    args: ""
    verbose: true
    ignore_errors: false # Default is false

