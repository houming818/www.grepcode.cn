
<script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "xqps53p16h");
</script>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  },
  svg: { fontCache: 'global' }
};
</script>
<script defer src="/js/tex-svg.js?v=3.2.2-full-1"></script>

<link rel="alternate" type="text/plain" href="{{ "llms.txt" | absURL }}" title="{{ site.Title }} research index for language models">
<meta name="robots" content="max-image-preview:large, max-snippet:-1, max-video-preview:-1">

{{- if .IsHome }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebSite",
  "@id": {{ printf "%s#website" site.Home.Permalink | jsonify }},
  "url": {{ site.Home.Permalink | jsonify }},
  "name": {{ site.Title | jsonify }},
  "description": {{ site.Params.description | jsonify }},
  "inLanguage": {{ site.Language.LanguageCode | jsonify }},
  "publisher": {
    "@type": "Organization",
    "name": {{ site.Title | jsonify }},
    "url": {{ site.Home.Permalink | jsonify }}
  }
}
</script>
{{- else if and .IsSection (eq .Section "spr") }}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "@id": {{ printf "%s#collection" .Permalink | jsonify }},
  "url": {{ .Permalink | jsonify }},
  "name": {{ .Title | jsonify }},
  "description": {{ .Description | jsonify }},
  "inLanguage": {{ site.Language.LanguageCode | jsonify }},
  "isPartOf": { "@id": {{ printf "%s#website" site.Home.Permalink | jsonify }} },
  "about": [
    { "@type": "Thing", "name": "TreeHeap" },
    { "@type": "Thing", "name": "Recursive neural architecture" },
    { "@type": "Thing", "name": "FOLD and UNFOLD" }
  ],
  "mainEntity": {
    "@type": "ItemList",
    "numberOfItems": {{ len .RegularPages }}
  }
}
</script>
{{- end }}

<style>
/* ── Block-level line numbers (paragraphs, headings, lists, blockquotes) ── */
.post-content { counter-reset: block-num; }
.post-content > h1,
.post-content > h2,
.post-content > h3,
.post-content > h4,
.post-content > p,
.post-content > blockquote,
.post-content > ul,
.post-content > ol,
.post-content > table { counter-increment: block-num; }
.post-content > h1::before,
.post-content > h2::before,
.post-content > h3::before,
.post-content > h4::before,
.post-content > p::before,
.post-content > blockquote::before,
.post-content > ul::before,
.post-content > ol::before,
.post-content > table::before {
  content: counter(block-num);
  font-size: 0.68em; color: var(--secondary); opacity: 0.55;
  margin-right: 0.5em; vertical-align: super;
  user-select: none;
}
.post-content > hr { counter-increment: block-num; }

/* MathJax SVG is self-hosted; wide display equations scroll on small screens. */
.post-content mjx-container[display="true"] {
  overflow-x: auto;
  overflow-y: hidden;
  padding: 0.35em 0;
}

/* ── Code block per-line numbers (Hugo chroma output) ── */
.post-content .highlight pre code { counter-reset: code-line; }
.post-content .highlight pre code > span:first-child { counter-reset: code-line; }
.post-content .highlight pre code > span {
  counter-increment: code-line;
}
.post-content .highlight pre code > span::before {
  content: counter(code-line);
  display: inline-block; width: 2.2em; margin-right: 0.6em;
  text-align: right; color: var(--secondary); opacity: 0.45;
  font-size: 0.78em; user-select: none; flex-shrink: 0;
}
</style>
