# ===============================================
# = Hugo Site Config: www.grepcode.cn
# ===============================================
baseURL = "https://www.grepcode.cn/"
uglyURLs = true
disableKinds = ["taxonomy", "term"]
defaultContentLanguage = "zh-cn"
languageCode = "zh-CN"
title = "GrepCode"
theme = ["blog-theme", "PaperMod"]
contentDir = "src"
publishDir = "dist"
themesDir = "themes"
enableRobotsTXT = true

[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "LLMS"]

[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["$$", "$$"], ["\\[", "\\]"]]
inline = [["$", "$"], ["\\(", "\\)"]]

[markup.goldmark.renderer]
unsafe = true

[params]
defaultTheme = "dark"
description = "TreeHeap 是一种以递归树堆、FOLD/UNFOLD、多分辨率退火和可证伪实验为核心的开放 AI 架构研究。GrepCode 公开 SPR 研究日志、数学定义、代码、失败记录与实验结果。"
keywords = ["TreeHeap", "SPR", "递归树堆", "人工智能架构", "FOLD", "UNFOLD", "多分辨率", "私有协议", "ARA", "可证伪实验"]
images = ["/img/treeheap-research-series.png"]
ShowReadingTime = false
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = false
ShowCodeCopyButtons = false
ShowToc = false
ShowFullTextinRSS = true
    comments = true
mainSections = [""]

[author]
name = "Houming818 (nio) & opencode (AI)"
email = "houming818@qq.com"

[params.schema]
publisherType = "Organization"
sameAs = [
    "https://github.com/houming818",
    "https://www.grepcode.cn/spr/index.html"
]

[params.homeInfoParams]
Title = "GrepCode"
Content = "代码是机器的诗，诗是灵魂的代码"
