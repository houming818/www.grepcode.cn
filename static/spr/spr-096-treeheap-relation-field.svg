<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">TreeHeap 中 R、路由与 READ 的边界</title>
  <desc id="desc">R 等于 Query-Key 关系计算。softmax 将左右关系分数变成路由概率，Value 和 READ 再读取节点内容。</desc>
  <rect width="1280" height="720" fill="#f6f7f9"/>
  <style>
    .title { font: 700 34px sans-serif; fill: #18212b; }
    .sub { font: 400 18px sans-serif; fill: #4b5968; }
    .label { font: 700 22px sans-serif; fill: #18212b; }
    .body { font: 400 18px sans-serif; fill: #263442; }
    .math { font: 500 20px serif; fill: #18212b; }
    .box { fill: #ffffff; stroke: #536579; stroke-width: 2; rx: 6; }
    .q { fill: #e6f4ed; stroke: #287a53; stroke-width: 2; }
    .r { fill: #fff1d9; stroke: #b66b00; stroke-width: 2; }
    .v { fill: #e9eef8; stroke: #42639a; stroke-width: 2; }
    .edge { stroke: #536579; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #8a96a3; stroke-width: 2; stroke-dasharray: 8 7; fill: none; }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#536579"/>
    </marker>
  </defs>
  <text x="60" y="62" class="title">R = QK：关系、路由与内容读取是三件事</text>
  <text x="60" y="96" class="sub">每条 parent-child 候选边计算一次 QK；Query 与 Key 都显式携带路径前缀编码。</text>
  <rect x="70" y="150" width="250" height="110" class="q" rx="6"/>
  <text x="195" y="190" text-anchor="middle" class="label">Query</text>
  <text x="195" y="226" text-anchor="middle" class="math">q = W_Q[x | h_p | z_p]</text>
  <rect x="470" y="130" width="300" height="80" class="box"/>
  <text x="620" y="165" text-anchor="middle" class="label">left Key</text>
  <text x="620" y="193" text-anchor="middle" class="math">k_l = W_K[g_l | left | z_p→l]</text>
  <rect x="470" y="230" width="300" height="80" class="box"/>
  <text x="620" y="265" text-anchor="middle" class="label">right Key</text>
  <text x="620" y="293" text-anchor="middle" class="math">k_r = W_K[g_r | right | z_p→r]</text>
  <path d="M320 192 C375 180 410 170 470 170" class="edge"/>
  <path d="M320 220 C375 240 410 270 470 270" class="edge"/>
  <rect x="855" y="130" width="350" height="180" class="r" rx="6"/>
  <text x="1030" y="168" text-anchor="middle" class="label">R：QK 关系分数</text>
  <text x="1030" y="211" text-anchor="middle" class="math">R(p,l) = qᵀk_l / √d</text>
  <text x="1030" y="248" text-anchor="middle" class="math">R(p,r) = qᵀk_r / √d</text>
  <text x="1030" y="286" text-anchor="middle" class="body">只计算“当前 Query 与哪条边更相关”</text>
  <path d="M770 170 L855 180" class="edge"/>
  <path d="M770 270 L855 260" class="edge"/>
  <rect x="110" y="380" width="360" height="120" class="box"/>
  <text x="290" y="420" text-anchor="middle" class="label">softmax：路由概率</text>
  <text x="290" y="460" text-anchor="middle" class="math">α_l, α_r = softmax(R_l, R_r)</text>
  <text x="290" y="487" text-anchor="middle" class="body">回答“向左、向右各走多少”</text>
  <rect x="810" y="380" width="360" height="120" class="v" rx="6"/>
  <text x="990" y="420" text-anchor="middle" class="label">Value / READ：读取内容</text>
  <text x="990" y="460" text-anchor="middle" class="math">o = α_l v_l + α_r v_r</text>
  <text x="990" y="487" text-anchor="middle" class="body">回答“从节点中取回什么”</text>
  <path d="M900 310 C760 340 570 370 470 420" class="edge"/>
  <path d="M470 440 L810 440" class="edge"/>
  <rect x="80" y="565" width="1120" height="95" class="box"/>
  <text x="110" y="604" class="label">树上路径</text>
  <text x="300" y="604" class="math">P(path | q) = ∏ P(child_d | parent_d, q_d)</text>
  <text x="110" y="638" class="body">路径由多次局部 QK 判断形成；它是条件概率链，不是多个“R 状态变换器”的复合。</text>
  <path d="M640 500 L640 565" class="dash"/>
</svg>
