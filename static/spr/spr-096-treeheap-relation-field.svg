<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Transformer 全连接关系图与 TreeHeap 递归关系场</title>
  <desc id="desc">左侧展示 Query-Key 生成输入相关的全连接关系，右侧展示同一查询在 TreeHeap 节点上形成局部条件路由，并由 parent 近似后代响应。</desc>
  <defs>
    <style>
      .bg { fill: #f7f8fa; }
      .panel { fill: #ffffff; stroke: #c9ced6; stroke-width: 2; }
      .title { font: 700 28px system-ui, sans-serif; fill: #17212b; }
      .sub { font: 600 20px system-ui, sans-serif; fill: #2d3b47; }
      .txt { font: 17px system-ui, sans-serif; fill: #35424d; }
      .small { font: 15px system-ui, sans-serif; fill: #53616d; }
      .node { fill: #eef4f8; stroke: #3f6478; stroke-width: 2; }
      .query { fill: #fff0cb; stroke: #b77913; stroke-width: 2.5; }
      .active { fill: #dff3e7; stroke: #2f7d4d; stroke-width: 2.5; }
      .muted { fill: #f1f2f4; stroke: #9aa4ad; stroke-width: 1.6; }
      .edge { stroke: #74828f; stroke-width: 2; fill: none; }
      .edge-hot { stroke: #2f7d4d; stroke-width: 5; fill: none; }
      .edge-warm { stroke: #d59a2b; stroke-width: 3; fill: none; }
      .matrix { fill: #eef4f8; stroke: #3f6478; stroke-width: 2; }
      .cell-hot { fill: #4f8da8; }
      .cell-mid { fill: #98bdcc; }
      .cell-low { fill: #dce9ef; }
      .formula { font: 18px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #17212b; }
      .divider { stroke: #aeb7bf; stroke-width: 2; stroke-dasharray: 8 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#74828f"/>
    </marker>
    <marker id="arrowHot" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2f7d4d"/>
    </marker>
  </defs>

  <rect class="bg" width="1280" height="700"/>
  <rect class="panel" x="32" y="34" width="568" height="626" rx="8"/>
  <rect class="panel" x="680" y="34" width="568" height="626" rx="8"/>
  <line class="divider" x1="640" y1="58" x2="640" y2="640"/>

  <text class="title" x="64" y="82">Transformer：全连接动态关系</text>
  <text class="txt" x="64" y="118">共享参数生成 Q/K，当前输入生成 R(X)</text>

  <circle class="query" cx="102" cy="210" r="34"/>
  <circle class="node" cx="240" cy="165" r="34"/>
  <circle class="node" cx="240" cy="255" r="34"/>
  <circle class="node" cx="240" cy="345" r="34"/>
  <text class="sub" x="89" y="217">q₂</text>
  <text class="sub" x="226" y="172">k₁</text>
  <text class="sub" x="226" y="262">k₂</text>
  <text class="sub" x="226" y="352">k₃</text>
  <path class="edge-warm" d="M136 201 C170 182, 190 176, 206 170" marker-end="url(#arrow)"/>
  <path class="edge-hot" d="M136 214 C170 225, 190 243, 206 250" marker-end="url(#arrowHot)"/>
  <path class="edge" d="M132 229 C168 273, 190 320, 207 337" marker-end="url(#arrow)"/>
  <text class="small" x="300" y="180">每个 Query 比较全部 Key</text>
  <text class="small" x="300" y="209">边权随句子变化</text>
  <text class="formula" x="300" y="248">Sᵢⱼ = qᵢᵀkⱼ</text>

  <text class="sub" x="64" y="432">动态矩阵 R(X)</text>
  <g transform="translate(68 456)">
    <rect class="matrix" x="0" y="0" width="168" height="168" rx="4"/>
    <rect class="cell-mid" x="10" y="10" width="42" height="42"/>
    <rect class="cell-low" x="63" y="10" width="42" height="42"/>
    <rect class="cell-hot" x="116" y="10" width="42" height="42"/>
    <rect class="cell-low" x="10" y="63" width="42" height="42"/>
    <rect class="cell-hot" x="63" y="63" width="42" height="42"/>
    <rect class="cell-mid" x="116" y="63" width="42" height="42"/>
    <rect class="cell-mid" x="10" y="116" width="42" height="42"/>
    <rect class="cell-low" x="63" y="116" width="42" height="42"/>
    <rect class="cell-mid" x="116" y="116" width="42" height="42"/>
  </g>
  <text class="formula" x="274" y="500">R(X) = Q(X)K(X)ᵀ</text>
  <text class="txt" x="274" y="536">规则固定，关系实例动态</text>
  <text class="txt" x="274" y="566">计算成本通常随 T² 增长</text>
  <text class="small" x="64" y="642">重点：参数不是当前句子的关系图</text>

  <text class="title" x="712" y="82">TreeHeap：递归关系场</text>
  <text class="txt" x="712" y="118">Query 在每个节点只比较当前 child</text>

  <circle class="query" cx="740" cy="202" r="32"/>
  <text class="sub" x="728" y="209">q</text>
  <circle class="active" cx="970" cy="174" r="38"/>
  <text class="sub" x="949" y="181">root</text>
  <path class="edge-hot" d="M772 198 C842 190, 886 182, 930 177" marker-end="url(#arrowHot)"/>

  <circle class="active" cx="854" cy="300" r="34"/>
  <circle class="muted" cx="1086" cy="300" r="34"/>
  <text class="sub" x="839" y="307">pL</text>
  <text class="sub" x="1070" y="307">pR</text>
  <path class="edge-hot" d="M948 205 L878 273"/>
  <path class="edge" d="M992 207 L1064 272"/>
  <text class="small" x="846" y="248">0.82</text>
  <text class="small" x="1061" y="248">0.18</text>

  <circle class="active" cx="784" cy="430" r="30"/>
  <circle class="muted" cx="924" cy="430" r="30"/>
  <circle class="muted" cx="1034" cy="430" r="30"/>
  <circle class="muted" cx="1168" cy="430" r="30"/>
  <text class="sub" x="770" y="437">k₁</text>
  <text class="sub" x="910" y="437">k₂</text>
  <text class="sub" x="1020" y="437">k₃</text>
  <text class="sub" x="1154" y="437">k₄</text>
  <path class="edge-hot" d="M839 331 L799 401"/>
  <path class="edge" d="M869 331 L911 401"/>
  <path class="edge" d="M1070 331 L1046 401"/>
  <path class="edge" d="M1100 331 L1155 402"/>

  <text class="formula" x="724" y="516">P(leaf|q) = ∏ P(child|q,parent)</text>
  <text class="formula" x="724" y="556">zₚ(q) = logsumexp(zL(q), zR(q))</text>
  <text class="txt" x="724" y="600">粗层先排除区域，细层只解决剩余歧义</text>
  <text class="small" x="712" y="642">目标：用较少节点访问近似完整 leaf 后验</text>
</svg>
