<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img" aria-labelledby="title desc">
  <title id="title">TreeHeap T0 multiscale probability embedding</title>
  <desc id="desc">Two line charts show held-out NLL decreasing and MRR increasing as visible probability bins grow from one to sixteen. TreeHeap outperforms a matched random partition at every non-degenerate scale.</desc>
  <rect width="1080" height="470" fill="#ffffff"/>
  <text x="540" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="700" fill="#17202a">TreeHeap T0 multiscale probability embedding</text>

  <g font-family="Arial, sans-serif" fill="#263238">
    <text x="280" y="62" text-anchor="middle" font-size="15" font-weight="700">Held-out retrieval distortion</text>
    <line x1="70" y1="80" x2="70" y2="365" stroke="#263238" stroke-width="1.5"/>
    <line x1="70" y1="365" x2="490" y2="365" stroke="#263238" stroke-width="1.5"/>
    <g stroke="#cfd8dc" stroke-width="1">
      <line x1="70" y1="85" x2="490" y2="85"/><line x1="70" y1="155" x2="490" y2="155"/>
      <line x1="70" y1="225" x2="490" y2="225"/><line x1="70" y1="295" x2="490" y2="295"/>
      <line x1="70" y1="365" x2="490" y2="365"/>
    </g>
    <g font-size="12" text-anchor="end">
      <text x="61" y="89">10</text><text x="61" y="159">9</text><text x="61" y="229">8</text>
      <text x="61" y="299">7</text><text x="61" y="369">6</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="90" y="386">1</text><text x="185" y="386">2</text><text x="280" y="386">4</text>
      <text x="375" y="386">8</text><text x="470" y="386">16</text>
    </g>
    <text x="280" y="412" text-anchor="middle" font-size="13">Visible probability bins K</text>
    <text x="18" y="225" text-anchor="middle" font-size="13" transform="rotate(-90 18 225)">NLL (lower is better)</text>
    <polyline points="90,88 185,162 280,237 375,301 470,346" fill="none" stroke="#167d8d" stroke-width="4"/>
    <polyline points="90,88 185,113 280,153 375,218 470,278" fill="none" stroke="#d05a47" stroke-width="3"/>
    <g fill="#167d8d"><circle cx="90" cy="88" r="5"/><circle cx="185" cy="162" r="5"/><circle cx="280" cy="237" r="5"/><circle cx="375" cy="301" r="5"/><circle cx="470" cy="346" r="5"/></g>
    <g fill="#d05a47"><rect x="86" y="84" width="8" height="8"/><rect x="181" y="109" width="8" height="8"/><rect x="276" y="149" width="8" height="8"/><rect x="371" y="214" width="8" height="8"/><rect x="466" y="274" width="8" height="8"/></g>

    <text x="790" y="62" text-anchor="middle" font-size="15" font-weight="700">Held-out target retrieval</text>
    <line x1="580" y1="80" x2="580" y2="365" stroke="#263238" stroke-width="1.5"/>
    <line x1="580" y1="365" x2="1000" y2="365" stroke="#263238" stroke-width="1.5"/>
    <g stroke="#cfd8dc" stroke-width="1">
      <line x1="580" y1="90" x2="1000" y2="90"/><line x1="580" y1="145" x2="1000" y2="145"/>
      <line x1="580" y1="200" x2="1000" y2="200"/><line x1="580" y1="255" x2="1000" y2="255"/>
      <line x1="580" y1="310" x2="1000" y2="310"/><line x1="580" y1="365" x2="1000" y2="365"/>
    </g>
    <g font-size="12" text-anchor="end">
      <text x="571" y="94">0.25</text><text x="571" y="149">0.20</text><text x="571" y="204">0.15</text>
      <text x="571" y="259">0.10</text><text x="571" y="314">0.05</text><text x="571" y="369">0</text>
    </g>
    <g font-size="12" text-anchor="middle">
      <text x="600" y="386">1</text><text x="695" y="386">2</text><text x="790" y="386">4</text>
      <text x="885" y="386">8</text><text x="980" y="386">16</text>
    </g>
    <text x="790" y="412" text-anchor="middle" font-size="13">Visible probability bins K</text>
    <text x="528" y="225" text-anchor="middle" font-size="13" transform="rotate(-90 528 225)">MRR (higher is better)</text>
    <polyline points="600,364 695,352 790,300 885,204 980,97" fill="none" stroke="#167d8d" stroke-width="4"/>
    <polyline points="600,364 695,357 790,327 885,255 980,159" fill="none" stroke="#d05a47" stroke-width="3"/>
    <g fill="#167d8d"><circle cx="600" cy="364" r="5"/><circle cx="695" cy="352" r="5"/><circle cx="790" cy="300" r="5"/><circle cx="885" cy="204" r="5"/><circle cx="980" cy="97" r="5"/></g>
    <g fill="#d05a47"><rect x="596" y="360" width="8" height="8"/><rect x="691" y="353" width="8" height="8"/><rect x="786" y="323" width="8" height="8"/><rect x="881" y="251" width="8" height="8"/><rect x="976" y="155" width="8" height="8"/></g>

    <g font-size="12">
      <line x1="340" y1="438" x2="372" y2="438" stroke="#167d8d" stroke-width="4"/><text x="380" y="442">TreeHeap partition</text>
      <line x1="565" y1="438" x2="597" y2="438" stroke="#d05a47" stroke-width="3"/><text x="605" y="442">Matched random partition</text>
    </g>
  </g>
</svg>
