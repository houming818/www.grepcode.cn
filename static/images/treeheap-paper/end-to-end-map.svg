<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="520" viewBox="0 0 1400 520" role="img" aria-labelledby="title desc">
  <title id="title">TreeHeap 当前端到端架构图</title>
  <desc id="desc">从语料背景场、概率下坠、句中写入、保序折叠、多分辨率状态、读取到解码生成的当前目标链路。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2.5}.known{fill:#ecfdf5;stroke:#15803d}.open{fill:#fff7ed;stroke:#c2410c}.train{fill:#eff6ff;stroke:#1d4ed8}.title{font:700 25px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.txt{font:21px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.small{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#475569}.edge{stroke:#64748b;stroke-width:3;fill:none}.grad{stroke:#7c3aed;stroke-width:3;stroke-dasharray:10 8;fill:none}.legend{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#334155}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7c3aed"/></marker>
  </defs>
  <rect class="bg" width="1400" height="520"/>
  <text x="50" y="55" class="title">TreeHeap 当前理论：已经接通什么，正在寻找什么</text>

  <g>
    <rect class="box known" x="45" y="145" width="175" height="110" rx="6"/>
    <text x="132" y="185" text-anchor="middle" class="txt">语料背景场</text>
    <text x="132" y="220" text-anchor="middle" class="small">P(context | token)</text>
    <rect class="box known" x="265" y="145" width="175" height="110" rx="6"/>
    <text x="352" y="185" text-anchor="middle" class="txt">概率下坠</text>
    <text x="352" y="220" text-anchor="middle" class="small">type Embedding</text>
    <rect class="box open" x="485" y="145" width="175" height="110" rx="6"/>
    <text x="572" y="185" text-anchor="middle" class="txt">句中 WRITE</text>
    <text x="572" y="220" text-anchor="middle" class="small">occurrence state</text>
    <rect class="box open" x="705" y="145" width="175" height="110" rx="6"/>
    <text x="792" y="185" text-anchor="middle" class="txt">保序 FOLD</text>
    <text x="792" y="220" text-anchor="middle" class="small">AB != BA</text>
    <rect class="box train" x="925" y="145" width="175" height="110" rx="6"/>
    <text x="1012" y="185" text-anchor="middle" class="txt">多尺度 READ</text>
    <text x="1012" y="220" text-anchor="middle" class="small">query 选择分辨率</text>
    <rect class="box train" x="1145" y="145" width="205" height="110" rx="6"/>
    <text x="1247" y="185" text-anchor="middle" class="txt">Decoder</text>
    <text x="1247" y="220" text-anchor="middle" class="small">logits → token</text>
  </g>

  <path class="edge" marker-end="url(#arrow)" d="M220 200H260"/>
  <path class="edge" marker-end="url(#arrow)" d="M440 200H480"/>
  <path class="edge" marker-end="url(#arrow)" d="M660 200H700"/>
  <path class="edge" marker-end="url(#arrow)" d="M880 200H920"/>
  <path class="edge" marker-end="url(#arrow)" d="M1100 200H1140"/>

  <path class="grad" marker-end="url(#purple)" d="M1248 300 C1150 390,650 390,353 300"/>
  <text x="800" y="420" text-anchor="middle" class="txt" fill="#7c3aed">任务 loss 的梯度反向约束 Decoder、READ、FOLD、WRITE 与路由参数</text>

  <rect class="box known" x="55" y="455" width="32" height="25" rx="3"/><text x="98" y="474" class="legend">已有有限证据</text>
  <rect class="box open" x="270" y="455" width="32" height="25" rx="3"/><text x="313" y="474" class="legend">当前核心算法缺口</text>
  <rect class="box train" x="535" y="455" width="32" height="25" rx="3"/><text x="578" y="474" class="legend">已有 reference，待与新状态合同接通</text>
</svg>
