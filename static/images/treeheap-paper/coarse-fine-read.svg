<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="650" viewBox="0 0 1280 650" role="img" aria-labelledby="title desc">
  <title id="title">TreeHeap 多分辨率 READ 示意图</title>
  <desc id="desc">同一概率质量在 root、coarse 和 fine 层的表示，以及 decoder query 对不同深度状态的加权读取。</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.band{fill:#fff;stroke:#334155;stroke-width:2}.root{fill:#dbeafe}.coarse{fill:#dcfce7}.fine{fill:#fef3c7}.read{fill:#f3e8ff;stroke:#7e22ce;stroke-width:3}.txt{font:22px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.small{font:18px system-ui,"Microsoft YaHei",sans-serif;fill:#475569}.head{font:700 26px system-ui,"Microsoft YaHei",sans-serif;fill:#172033}.edge{fill:none;stroke:#64748b;stroke-width:3}.pick{fill:none;stroke:#7e22ce;stroke-width:4}.formula{font:21px ui-monospace,Consolas,monospace;fill:#4c1d95}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker>
    <marker id="pickarrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7e22ce"/></marker>
  </defs>
  <rect class="bg" width="1280" height="650"/>
  <text x="50" y="55" class="head">同一对象的三种分辨率，不是三种无关张量</text>

  <text x="65" y="135" class="txt">depth 0</text>
  <rect class="band root" x="190" y="95" width="620" height="70" rx="5"/>
  <text x="500" y="138" text-anchor="middle" class="txt">root：1.00</text>

  <text x="65" y="260" class="txt">depth 1</text>
  <rect class="band coarse" x="190" y="220" width="124" height="70" rx="5"/>
  <rect class="band coarse" x="314" y="220" width="496" height="70" rx="5"/>
  <text x="252" y="263" text-anchor="middle" class="txt">0.20</text>
  <text x="562" y="263" text-anchor="middle" class="txt">0.80</text>

  <text x="65" y="385" class="txt">depth 2</text>
  <rect class="band fine" x="190" y="345" width="93" height="70" rx="5"/>
  <rect class="band fine" x="283" y="345" width="31" height="70" rx="5"/>
  <rect class="band fine" x="314" y="345" width="124" height="70" rx="5"/>
  <rect class="band fine" x="438" y="345" width="372" height="70" rx="5"/>
  <text x="236" y="388" text-anchor="middle" class="small">0.15</text>
  <text x="298" y="388" text-anchor="middle" class="small">.05</text>
  <text x="376" y="388" text-anchor="middle" class="small">0.20</text>
  <text x="624" y="388" text-anchor="middle" class="txt">0.60</text>

  <path class="edge" d="M500 165V210" marker-end="url(#arrow)"/>
  <path class="edge" d="M500 290V335" marker-end="url(#arrow)"/>

  <rect class="read" x="930" y="205" width="280" height="150" rx="6"/>
  <text x="1070" y="250" text-anchor="middle" class="head">READ(q)</text>
  <text x="1070" y="290" text-anchor="middle" class="formula">a = softmax(score)</text>
  <text x="1070" y="325" text-anchor="middle" class="small">按当前 query 混合不同深度</text>

  <path class="pick" d="M810 130 C875 130,875 225,925 245" marker-end="url(#pickarrow)"/>
  <path class="pick" d="M810 255 C875 255,875 270,925 275" marker-end="url(#pickarrow)"/>
  <path class="pick" d="M810 380 C875 380,875 325,925 310" marker-end="url(#pickarrow)"/>

  <path class="pick" d="M1070 355V455" marker-end="url(#pickarrow)"/>
  <rect class="read" x="850" y="470" width="440" height="105" rx="6"/>
  <text x="1070" y="510" text-anchor="middle" class="txt">读出状态 r(q)</text>
  <text x="1070" y="547" text-anchor="middle" class="formula">r = sum_d a_d h^(d)</text>

  <text x="65" y="505" class="txt">关键约束：</text>
  <text x="65" y="545" class="small">coarse 可由 fine 求和得到；</text>
  <text x="65" y="578" class="small">fine 不能只靠 coarse 唯一恢复；</text>
  <text x="65" y="611" class="small">READ 的选择必须由任务与因果消融验证。</text>
</svg>
